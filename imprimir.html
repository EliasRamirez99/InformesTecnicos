<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imprimir · OPS</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="stylesheet" href="css/estilos.css?v=20260923a">
  <link rel="stylesheet" href="css/imprimir.css?v=20260923a">
</head>
<body class="imprimiendo">
  <div id="barra-imp">
    <button id="btn-reimp" class="btn" type="button">🖨 Imprimir / Guardar PDF</button>
    <a class="btn ghost" id="btn-volver" href="index.html">← Volver</a>
    <span id="estado-imp"></span>
  </div>
  <div id="salida"></div>

  <script>window.PagedConfig = { auto: false };</script>
  <script src="js/config.js?v=20260923a"></script>
  <script src="js/common.js?v=20260923a"></script>
  <script src="js/plantillas.js?v=20260923a"></script>
  <script src="js/backend.js?v=20260923a"></script>
  <script src="js/impresion.js?v=20260923a"></script>
  <script src="js/paged.polyfill.js?v=20260923a"></script>
  <script>
    function esperarImagenes(cont, ms) {
      var pend = Array.prototype.slice.call(cont.querySelectorAll("img")).filter(function (i) { return !i.complete; });
      return new Promise(function (res) {
        if (!pend.length) return res();
        var done = 0, fin = false;
        var acabar = function () { if (!fin) { fin = true; res(); } };
        var check = function () { if (++done >= pend.length) acabar(); };
        pend.forEach(function (i) { i.addEventListener("load", check); i.addEventListener("error", check); });
        setTimeout(acabar, ms || 5000);
      });
    }
    (async function () {
      var estado = document.getElementById("estado-imp");
      var id = new URLSearchParams(location.search).get("id");
      if (!id) { estado.textContent = "Falta el id del documento."; return; }
      // 1) Documento: primero de caché (instantáneo, ya lo trajo el inicio/la vista);
      //    sólo si no está en caché lo pedimos al backend.
      var doc = cacheGet("it_doc_" + id);
      if (!doc) {
        estado.textContent = "Cargando documento…";
        var r = await Backend.obtenerDoc(id);
        if (!r || !r.ok) { estado.textContent = "No se encontró el documento."; return; }
        doc = r.doc;
      }
      estado.textContent = "Preparando para imprimir…";
      document.getElementById("btn-volver").href = "ver.html?id=" + encodeURIComponent(doc.id);
      document.title = doc.id;   // el navegador usa el título como nombre del PDF -> "INF-2026-0001.pdf"

      var fuente = document.createElement("div");
      Vista.render(doc, fuente);

      // Rótulo corrido (paged.js lo repite en cada hoja): logo + dominio · tipo/marca + título
      var m = doc.meta || {};
      var eq = [m.tipo_equipo, m.marca].filter(Boolean).join(" ");
      var l1 = [m.dominio, eq].filter(Boolean).join("  ·  ") || "OPS";
      var rh = document.createElement("div"); rh.className = "doc-run-header";
      var rhImg = document.createElement("img"); rhImg.className = "rh-logo"; rhImg.src = "img/logo-ops.svg?v=20260923a"; rhImg.alt = "OPS";
      var rhTxt = document.createElement("div"); rhTxt.className = "rh-txt";
      var rhA = document.createElement("div"); rhA.className = "rh-1"; rhA.textContent = l1;
      var rhB = document.createElement("div"); rhB.className = "rh-2"; rhB.textContent = m.titulo || "";
      rhTxt.appendChild(rhA); rhTxt.appendChild(rhB);
      rh.appendChild(rhImg); rh.appendChild(rhTxt);
      fuente.insertBefore(rh, fuente.firstChild);

      await esperarImagenes(fuente, 2500);

      var salida = document.getElementById("salida");
      var conPaged = false;
      try {
        var previewer = new Paged.Previewer();
        await Promise.race([
          previewer.preview(fuente, ["css/estilos.css?v=20260923a", "css/imprimir.css?v=20260923a"], salida),
          new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, 12000); })
        ]);
        conPaged = salida.querySelectorAll(".pagedjs_page").length > 0;
      } catch (e) { conPaged = false; }
      if (!conPaged) {                 // fallback: documento plano (imprime bien igual, sin numeración por hoja)
        document.body.classList.remove("imprimiendo");
        salida.innerHTML = "";
        salida.appendChild(fuente);
      }
      estado.textContent = "";
      var imprimir = function () { window.print(); };
      document.getElementById("btn-reimp").addEventListener("click", imprimir);
      setTimeout(imprimir, 500);   // abre el diálogo de impresión solo
    })();
  </script>
</body>
</html>
